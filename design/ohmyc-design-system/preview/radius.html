<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<div class="card" style="padding:24px">
<div style="display:flex;gap:16px;align-items:flex-end">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:5px;height:5px;background:#1d1d1f;border-radius:1px"></div><div class="mono">5 · tag</div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:36px;background:#1d1d1f;border-radius:10px"></div><div class="mono">10 · control</div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:80px;height:60px;background:#fff;border:1px solid #d2d2d7;border-radius:16px;box-shadow:var(--el-2)"></div><div class="mono">16 · card</div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:96px;height:68px;background:#FFF1E8;border:1px solid rgba(255,133,82,.2);border-radius:22px;transform:rotate(-1.4deg)"></div><div class="mono">22 · promise</div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:120px;height:80px;background:#fff;border-radius:36px;box-shadow:var(--el-3)"></div><div class="mono">36 · spotlight</div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:120px;height:44px;background:#FF8552;border-radius:980px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px">시작하기</div><div class="mono">980 · capsule</div></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:48px;height:48px;background:#000;border-radius:50%"></div><div class="mono">50% · circle</div></div>
</div>
<div class="mono" style="margin-top:16px;color:var(--fg-2)">Match radius to component class — never one-size-fits-all</div>
</div>
</body></html>
