<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn{font-family:var(--font-text);font-size:17px;font-weight:600;border-radius:980px;padding:14px 28px;border:none;cursor:pointer;line-height:1}
.btn-primary{background:#FF8552;color:#fff}
.btn-secondary{background:#1d1d1f;color:#fff}
.btn-quiet{background:#fff;color:#1d1d1f;border:1px solid #d2d2d7}
.btn-disabled{background:#FF8552;color:#fff;opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="card" style="padding:28px">
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
<button class="btn btn-primary">시작하기</button>
<button class="btn btn-primary" style="background:#E96A37">시작하기 · pressed</button>
<button class="btn btn-secondary">이제 만나러 가기</button>
<button class="btn btn-quiet">나중에</button>
<button class="btn btn-disabled" disabled>약속할게</button>
</div>
<div class="mono" style="margin-top:14px;color:var(--fg-2)">Capsule (980) · 600 weight · Pulse on tap · single accent</div>
</div>
</body></html>
