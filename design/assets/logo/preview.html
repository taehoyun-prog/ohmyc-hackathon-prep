<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ohmyc logo preview</title>
<style>
  @font-face {
    font-family: 'Pretendard Variable';
    src: url('../fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard Variable', -apple-system, sans-serif;
    background: #000;
    color: #f5f5f7;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .panel { padding: 64px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 32px; }
  .light { background: #f5f5f7; color: #1d1d1f; }
  .label { font-size: 12px; letter-spacing: 0.04em; opacity: 0.6; text-transform: uppercase; }
  .stack { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
  .row { display: flex; align-items: center; gap: 32px; }
  img { display: block; }
</style>
</head>
<body>
  <div class="panel light">
    <span class="label">on light · #f5f5f7</span>
    <div class="stack">
      <img src="ohmyc-wordmark.svg" alt="ohmyc wordmark" width="320" height="96">
      <img src="ohmyc-mark.svg" alt="ohmyc mark" width="96" height="96">
    </div>
  </div>
  <div class="panel">
    <span class="label">on dark · #000</span>
    <div class="stack">
      <img src="ohmyc-wordmark.svg" alt="ohmyc wordmark on dark" width="320" height="96" style="filter: invert(1);">
      <img src="ohmyc-mark.svg" alt="ohmyc mark on dark" width="96" height="96">
      <div style="font-weight: 600; font-size: 17px; letter-spacing: -0.01em;">처음 만나서 반가워. 나는 세린이야.</div>
    </div>
  </div>
</body>
</html>
